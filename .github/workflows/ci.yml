name: CI

on:
  push:
    branches: [master]
  pull_request:
  # release.yml から、リリース前のテストとして呼び出す。
  workflow_call:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        gemfile: [rails_7_1, rails_8_0, rails_8_1]
        exclude:
          # Rails 8.0 以降は Ruby 3.2 以上が必要。
          - ruby: '3.1'
            gemfile: rails_8_0
          - ruby: '3.1'
            gemfile: rails_8_1
          # Rails 7.1 はサポート終了済みで Ruby 4.0 に対応していない。
          - ruby: '4.0'
            gemfile: rails_7_1

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec
